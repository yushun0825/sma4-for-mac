name: Sma4Mac
options:
  developmentLanguage: ja
  knownRegions: [ja, Base]
  bundleIdPrefix: io.github.yushun0825
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  Sma4Core:
    path: Packages/Sma4Core
settings:
  base:
    SWIFT_VERSION: "6.0"
    # ふだんのビルドは「ローカルで実行するための署名」。配る DMG は Tools/release.sh が Developer ID で署名する
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    MARKETING_VERSION: "2.2.1"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_APP_SANDBOX: "NO"
    DEAD_CODE_STRIPPING: "YES"
targets:
  Sma4Mac:
    type: application
    platform: macOS
    sources:
      - path: Sma4Mac
    dependencies:
      - package: Sma4Core
        product: Sma4Core
    settings:
      base:
        PRODUCT_NAME: "Sma4 for Mac"
        PRODUCT_MODULE_NAME: Sma4Mac
        PRODUCT_BUNDLE_IDENTIFIER: io.github.yushun0825.sma4mac
        INFOPLIST_FILE: Sma4Mac/Support/Info.plist
        GENERATE_INFOPLIST_FILE: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        DEVELOPMENT_LANGUAGE: ja
        ENABLE_HARDENED_RUNTIME: "YES"
        COMBINE_HIDPI_IMAGES: "YES"
schemes:
  Sma4Mac:
    build:
      targets:
        Sma4Mac: all
    run:
      config: Debug
    archive:
      config: Release
